services:
  ops-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPS_AGENT_IMAGE:-ops-agent-core:0.1.0}
    restart: unless-stopped
    environment:
      OPS_AGENT_ENV: production
      OPS_AGENT_LOG_LEVEL: ${OPS_AGENT_LOG_LEVEL:-INFO}
      OPS_AGENT_BUILTIN_SKILLS_PATH: /opt/ops-agent/skills/builtin
      OPS_AGENT_PRODUCT_SKILLS_PATH: /opt/ops-agent/plugins/product-skills
      OPS_AGENT_SKILL_CORE_API: ${OPS_AGENT_SKILL_CORE_API:-1.0}
      OPS_AGENT_MCP_ALLOWED_HOSTS: ${OPS_AGENT_MCP_ALLOWED_HOSTS:-127.0.0.1:8000,localhost:8000}
      OPS_AGENT_REPRODUCTION_ADAPTER: ${OPS_AGENT_REPRODUCTION_ADAPTER:-playwright-toxiproxy}
      OPS_AGENT_BROWSER_BASE_URL: http://toxiproxy:8666/
      OPS_AGENT_BROWSER_HEADLESS: ${OPS_AGENT_BROWSER_HEADLESS:-true}
      OPS_AGENT_REPRODUCTION_SCREENSHOT_DIR: /tmp/ops-agent/screenshots
      OPS_AGENT_TOXIPROXY_API_URL: http://toxiproxy:8474
      OPS_AGENT_TOXIPROXY_UPSTREAM: ${OPS_AGENT_TOXIPROXY_UPSTREAM:-host.docker.internal:8080}
      OPS_AGENT_TOXIPROXY_LISTEN: 0.0.0.0:8666
      OPS_AGENT_TOXIPROXY_LATENCY_MS: ${OPS_AGENT_TOXIPROXY_LATENCY_MS:-80}
      OPS_AGENT_REPRODUCTION_TOOL_TIMEOUT_SECONDS: ${OPS_AGENT_REPRODUCTION_TOOL_TIMEOUT_SECONDS:-10}
    ports:
      - "${OPS_AGENT_PORT:-8000}:8000"
    volumes:
      - ${OPS_AGENT_PRODUCT_SKILLS_HOST_PATH:-./runtime-data/product-skills}:/opt/ops-agent/plugins/product-skills:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - ops-agent-network

  toxiproxy:
    image: ${OPS_AGENT_TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.12.0}
    restart: unless-stopped
    expose:
      - "8474"
      - "8666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "--host", "http://127.0.0.1:8474", "list"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - ops-agent-network

networks:
  ops-agent-network:
    name: ops-agent-network
